<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2f6f5e">
    <title>Quarterly Goal Plan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="container header-inner">
            <div class="brand">
                <span class="brand-mark">🎯</span>
                <div>
                    <h1>Quarterly Goal Plan</h1>
                    <p class="quarter-label" id="quarterLabel"></p>
                </div>
            </div>
            <nav class="tabs">
                <button class="tab active" data-action="tab" data-tab="dashboard">Dashboard</button>
                <button class="tab" data-action="tab" data-tab="plan">My Plan</button>
                <button class="tab" data-action="tab" data-tab="tracker">Weekly Tracker</button>
                <button class="tab" data-action="tab" data-tab="progress">Progress</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="view-dashboard" class="view"></section>
        <section id="view-plan" class="view hidden"></section>
        <section id="view-tracker" class="view hidden"></section>
        <section id="view-progress" class="view hidden"></section>
    </main>

    <footer class="app-footer">
        <div class="container footer-inner">
            <p>Your plan saves automatically in this browser.</p>
            <div class="footer-actions">
                <button class="btn btn-ghost" data-action="export">Export JSON</button>
                <button class="btn btn-ghost" data-action="import">Import JSON</button>
                <button class="btn btn-ghost danger" data-action="reset">Reset to starter plan</button>
                <input type="file" id="importFile" accept="application/json,.json" hidden>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
